name: Refresh forecast

on:
  workflow_dispatch:
  schedule:
    # Tuesday 16:00 UTC, after the weekend slate is usually in the nflverse files.
    - cron: "0 16 * * 2"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild data/season.json
        run: python -m model.build

      - name: Commit and push if the forecast changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json
          if git diff --cached --quiet; then
            echo "season.json unchanged"
          else
            git commit -m "Refresh weekly NFL forecast"
            git push
          fi
