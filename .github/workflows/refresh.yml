name: Refresh forecast

on:
  workflow_dispatch:
  schedule:
    # Post-game scoreboard refreshes after Thursday, Sunday, and Monday nights.
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 2"
    - cron: "0 6 * * 5"
    # Lock the next slate on Tuesday after nflverse has usually caught up.
    - cron: "0 16 * * 2"

permissions:
  contents: write

concurrency:
  group: refresh-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test model math
        run: python -m unittest model.test_build

      - name: Rebuild data/season.json
        run: python -m model.build

      - name: Validate forecast data
        run: python -m model.validate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate website
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit and push if the forecast changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json
          if git diff --cached --quiet; then
            echo "season.json unchanged"
          else
            git commit -m "Refresh weekly NFL forecast"
            git push
          fi
